name: Build Safari Extension

on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  build-safari:
    runs-on: macos-latest
    steps:
      - name: 1. 下载源代码
        uses: actions/checkout@v4

      - name: 2. 转换为 Safari 项目
        run: |
          xcrun safari-web-extension-converter . --project-location ./SafariBuild --app-name "MultiSubtitle" --no-prompt

      - name: 3. 编译为 Mac 应用
        run: |
          cd SafariBuild/MultiSubtitle
          xcodebuild -project "MultiSubtitle.xcodeproj" -scheme "MultiSubtitle" -configuration Release SYMROOT=$(PWD)/build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: 4. 压缩打包 App
        run: |
          cd SafariBuild/MultiSubtitle/build/Release
          zip -r ../../../../MultiSubtitle-Safari.zip MultiSubtitle.app

      - name: 5. 提供下载
        uses: actions/upload-artifact@v4
        with:
          name: MultiSubtitle-Mac-App
          path: MultiSubtitle-Safari.zip
